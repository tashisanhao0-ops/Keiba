name: Auto Update Keiba Race Data

on:
  schedule:
    # 毎週月曜日 09:00 JST (UTC 00:00) : 今週の重賞データ・特別登録馬更新
    - cron: '0 0 * * 1'
    # 毎週金曜日 10:15 JST (UTC 01:15) : JRA公式枠順確定直後の第1回自動取得
    - cron: '15 1 * * 5'
    # 毎週金曜日 11:00 JST (UTC 02:00) : JRA公式枠順確定後の全頭データ完全同期
    - cron: '0 2 * * 5'
    # 毎週金曜日 18:00 JST (UTC 09:00) : 金曜夕方オッズ・枠順再検証
    - cron: '0 9 * * 5'
    # 毎週土曜日 09:00 JST (UTC 00:00) : 土曜重賞・公式クッション値・確定オッズ更新
    - cron: '0 0 * * 6'
    # 毎週日曜日 09:00 JST (UTC 00:00) : 日曜重賞・公式クッション値・確定オッズ更新
    - cron: '0 0 * * 0'
    # 毎週日曜日 14:00 JST (UTC 05:00) : 発走直前リアルタイムオッズ更新
    - cron: '0 5 * * 0'
  workflow_dispatch: # GitHub画面から手動でワンクリック即時実行も可能

jobs:
  update-race:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリインストール
        run: |
          pip install beautifulsoup4 requests lxml

      - name: 最新レースデータ自動取得スクリプト実行 (枠順確定全頭同期)
        run: |
          python update_race_data.py

      - name: 変更をGitHubへ自動コミット＆プッシュ (GitHub Pages自動反映)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "変更はありませんでした（最新状態維持）。"
          else
            git commit -m "Auto Update: JRA枠順確定・今週の重賞全頭データ自動同期 [skip ci]"
            git pull --rebase origin main || git pull --rebase || true
            git push
          fi
