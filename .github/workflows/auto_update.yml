name: Auto Update Keiba Race Data

on:
  schedule:
    - cron: '0 0 * * 1'
    - cron: '15 1 * * 5'
    - cron: '0 2 * * 5'
    - cron: '0 9 * * 5'
    - cron: '0 22,23 * * 5'
    - cron: '0 * * * 6'
    - cron: '0 0-7 * * 0'
  workflow_dispatch:

jobs:
  update-race:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリインストール
        run: |
          pip install beautifulsoup4 requests lxml

      - name: 最新レースデータ自動取得＆精密能力計算実行
        run: |
          python update_race_data.py

      - name: 変更をGitHubへ自動コミット＆プッシュ (GitHub Pages自動反映)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "変更はありませんでした（最新状態維持）。"
          else
            git commit -m "Auto Update: JRA重賞精密データ＆最新オッズ1時間ごと自動同期 [skip ci]"
            git pull --rebase origin main || git pull --rebase || true
            git push
          fi
